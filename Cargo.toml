[workspace]
resolver = "2"
# The editor test fixture is a crate of its own so rust-analyzer can load it,
# but it is not part of this workspace.
exclude = ["editors"]
members = [
    "crates/rsx",
    "crates/rsx-core",
    "crates/rsx-macros",
    "crates/rsx-cli",
    "crates/rsx-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"

[workspace.dependencies]
rsx-core = { path = "crates/rsx-core", version = "0.1.0" }
rsx-macros = { path = "crates/rsx-macros", version = "0.1.0" }
rsx-lsp = { path = "crates/rsx-lsp", version = "0.1.0" }

[profile.bench]
lto = true
codegen-units = 1
