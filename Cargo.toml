[workspace]
resolver = "2"
members = ["crates/rsx", "crates/rsx-core", "crates/rsx-macros", "crates/rsx-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"

[workspace.dependencies]
rsx-core = { path = "crates/rsx-core", version = "0.1.0" }
rsx-macros = { path = "crates/rsx-macros", version = "0.1.0" }

[profile.bench]
lto = true
codegen-units = 1
